<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- Hourmint app icon: a clock whose minute hand is a mint leaf.
       macOS icon grid: 824×824 body centred on a 1024 canvas. -->
  <defs>
    <linearGradient id="bg" x1="0.15" y1="0" x2="0.85" y2="1">
      <stop offset="0" stop-color="#2dd4a0"/>
      <stop offset="0.55" stop-color="#0d9a6c"/>
      <stop offset="1" stop-color="#065f46"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.28"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="face" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#e9f7f1"/>
    </linearGradient>
    <linearGradient id="leaf" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#047857"/>
      <stop offset="1" stop-color="#34d399"/>
    </linearGradient>
    <filter id="drop" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#022c22" flood-opacity="0.35"/>
    </filter>
    <filter id="body" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000000" flood-opacity="0.22"/>
    </filter>
  </defs>

  <g filter="url(#body)">
    <rect x="100" y="100" width="824" height="824" rx="186" fill="url(#bg)"/>
    <rect x="100" y="100" width="824" height="824" rx="186" fill="url(#shine)"/>
  </g>

  <!-- clock face -->
  <circle cx="512" cy="522" r="262" fill="url(#face)" filter="url(#drop)"/>

  <!-- hour ticks -->
  <g stroke="#0d9a6c" stroke-width="22" stroke-linecap="round" opacity="0.85">
    <line x1="512" y1="290" x2="512" y2="322"/>
    <line x1="744" y1="522" x2="712" y2="522"/>
    <line x1="512" y1="754" x2="512" y2="722"/>
    <line x1="280" y1="522" x2="312" y2="522"/>
  </g>

  <!-- hour hand (pointing to 10) -->
  <line x1="512" y1="522" x2="512" y2="392" stroke="#064e3b" stroke-width="30" stroke-linecap="round" transform="rotate(-60 512 522)"/>

  <!-- minute hand: a mint leaf (pointing to 2) -->
  <g transform="translate(512 522) rotate(58)">
    <path d="M0 6 C 62 -38, 74 -150, 0 -222 C -74 -150, -62 -38, 0 6 Z" fill="url(#leaf)"/>
    <path d="M0 -14 L0 -196" stroke="#ecfdf5" stroke-width="9" stroke-linecap="round" opacity="0.85"/>
    <path d="M0 -70 L30 -104 M0 -112 L-28 -144 M0 -150 L20 -172" stroke="#ecfdf5" stroke-width="7" stroke-linecap="round" opacity="0.6"/>
  </g>

  <!-- centre cap -->
  <circle cx="512" cy="522" r="26" fill="#064e3b"/>
  <circle cx="512" cy="522" r="10" fill="#34d399"/>
</svg>
